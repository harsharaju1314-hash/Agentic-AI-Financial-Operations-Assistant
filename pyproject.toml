[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finops-assistant"
version = "1.0.0"
description = "Enterprise Multi-Agent AI Financial Operations & Fraud Investigation Platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Harshavardhan Varma", email = "harsharaju1314@gmail.com" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["api", "agents", "ml", "database", "data", "cloud", "config"]
omit = ["tests/*", "dashboard/*"]
